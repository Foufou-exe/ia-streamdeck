# Analyse statique des scripts Python (tools/, plugin/tools/)
target-version = "py310"
line-length = 160

[lint]
# erreurs pyflakes, erreurs pycodestyle, bugbear (bugs probables), pyupgrade
select = ["E4", "E7", "E9", "F", "B", "UP"]
# style compact volontaire du dépôt : imports groupés, « ; » sur une ligne, lambdas nommées
ignore = ["E401", "E702", "E731"]
