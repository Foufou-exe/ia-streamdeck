version: 2
updates:
  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)          # dépendance embarquée dans le plugin → apparaît dans le changelog
      prefix-development: chore(deps-dev)
    groups:
      dev:
        dependency-type: development

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
