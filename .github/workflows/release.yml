# Release automatique (release-please) :
#  1. chaque push sur main met à jour une PR « chore(main): release x.y.z » (version + CHANGELOG.md)
#     calculée à partir des Conventional Commits ;
#  2. la PR est complétée avec le manifest du plugin régénéré (Version x.y.z.0) et le package-lock ;
#  3. au merge de la PR : tag vX.Y.Z, release GitHub, puis build et publication du plugin et du profil.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # étiquettes « autorelease: pending / tagged »
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PAT optionnel (secret RELEASE_PLEASE_TOKEN) pour que la CI tourne aussi sur la PR de release
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr:
    name: Régénérer les fichiers versionnés de la PR de release
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Build (manifest.json) et package-lock à la nouvelle version
        working-directory: plugin
        run: |
          npm ci
          npm install --package-lock-only --ignore-scripts
          npm run build
      - name: Commit sur la branche de release
        run: |
          if git diff --quiet; then echo "Rien à synchroniser."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: synchroniser le manifest et le package-lock du plugin"
          git push

  publish:
    name: Publier le plugin et le profil
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Plugin (.streamDeckPlugin)
        working-directory: plugin
        run: |
          npm ci
          npm run pack
          npm test
          npm run validate
      - name: Vérifier la version embarquée
        run: |
          expected="${TAG#v}.0"
          actual=$(node -p "require('./plugin/com.foufou-exe.profil-ia.sdPlugin/manifest.json').Version")
          if [ "$actual" != "$expected" ]; then echo "::error::manifest $actual ≠ $expected"; exit 1; fi
      - name: Profil (.streamDeckProfile)
        run: |
          pip install "$(grep -i '^pillow' tools/requirements.txt)"
          python tools/build-profile.py --pack
      - name: Joindre les fichiers à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum com.foufou-exe.profil-ia.streamDeckPlugin Profil-IA.streamDeckProfile > SHA256SUMS.txt)
          gh release upload "$TAG" \
            dist/com.foufou-exe.profil-ia.streamDeckPlugin \
            dist/Profil-IA.streamDeckProfile \
            dist/SHA256SUMS.txt \
            --clobber
